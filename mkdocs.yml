site_name: GremlinEx
site_url: https://github.com/muchimi/JoystickGremlinEx
theme:
  name: material
  features:
      - navigation.tabs
      - navigation.tabs.sticky  
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7 # Icon for light mode
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4 # Icon for dark mode
        name: Switch to light mode  
plugins:
  - search
  - glightbox
  - autorefs
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3
nav:
  - Home: index.md
  - Overview: overview.md
  - Usage: usage.md
  - Devices:
      - Bitfocus Companion Setup Guide: devices/bitfocus_companion_setup_guide.md
      - Loopback Device User Guide: devices/loopback_device_user_guide.md
      - OSC Device User Guide: devices/osc_device_user_guide.md
      - Star Citizen Device User Guide: devices/star_citizen_user_guide.md
      - State Device User Guide: devices/state_device_user_guide.md
  - Containers : containers.md
  - Actions:
      - Action Reference: actions.md
      - Map to Keyboard/Mouse Ex User Guide: actions/keyboard_ex_user_guide.md
  - Mapping Guide: mapping.md
  - Resources: resources.md
  - Scripting: scripting.md
  - Credits: credits.md
