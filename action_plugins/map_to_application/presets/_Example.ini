; _Example.ini - copy and rename (e.g. MyApp.ini) to add an app to the preset list.
; Files starting with _ are not listed.  One function per line:  name = key [option]

[app]
program = MyApp.exe          ; with .exe exact, without .exe 'contains'
window_title =
delivery = window            ; window | keyboard | focus

[functions]
Next page = PgDn
Save = ctrl+s
Help = F1 [focus]
Bring to front = focus
