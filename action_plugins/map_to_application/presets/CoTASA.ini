; CoTASA.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; CoTASA listens to real keystrokes (keyboard hook): delivery keyboard. Condor receives them too.

[app]
program = CoTASA.exe
window_title =
delivery = keyboard

[source]
type = condortools
path = C:\CondorTools\CoTASA\Settings\CoTASA.ini

[functions]
; Empty on purpose: filled from YOUR CoTASA settings by Install.bat, or later by
; action_plugins_src\tools\gx_update_presets.bat. You can also add functions by hand.
