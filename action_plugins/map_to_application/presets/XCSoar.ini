; XCSoar.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; Keys as in the AHK tool. F2-F4 and F6-F10 need custom_keys.xci in XCSoar.

[app]
program = XCSoar.exe
window_title =
delivery = window

[functions]
Enter = Enter
Escape = Escape
Quick menu = F1
Up = Up
Down = Down
Left = Left
Right = Right
Zoom out = F3
Zoom in = F4
Pan mode = F2
Auto MC = F6
MC up = F7
MC down = F8
Task next = F9
Task previous = F10
Toggle focus (sim / app) = focus
