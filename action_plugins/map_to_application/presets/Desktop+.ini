; Desktop+.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; Desktop+ hotkeys are global: assign them in Desktop+ (Settings > Input > Global Hotkeys);
; gx_update_presets.bat reads them from Desktop+'s config.ini.

[app]
program = DesktopPlus.exe
window_title =
delivery = keyboard

[source]
type = desktopplus
path = C:\Program Files (x86)\Steam\steamapps\common\DesktopPlus

[functions]
; Empty on purpose: filled from YOUR Desktop+ settings by Install.bat, or later by
; action_plugins_src\tools\gx_update_presets.bat. You can also add functions by hand.
