; TeamSpeak.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; TeamSpeak 3 hotkeys are global (TeamSpeak 5: program = TeamSpeak.exe). TeamSpeak can also read
; joystick/vJoy buttons itself - then no action is needed.

[app]
program = ts3client_win64.exe
window_title =
delivery = keyboard

[functions]
; Push to talk = ctrl+shift+F9
; Mute = ctrl+shift+F10
