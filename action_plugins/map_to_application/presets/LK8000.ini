; LK8000.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; Keys as in the AHK tool. Needs DEFAULT_MENU.TXT and the device QWERTY Keyboard in LK8000.

[app]
program = LK8000-PC.exe
window_title =
delivery = window

[functions]
Enter = Enter
Escape = Escape
Quick menu = F1
Up = Up
Down = Down
Left = Left
Right = Right
Zoom out = F3
Zoom in = F4
Pan mode = F2
Auto MC = F6
MC up = F7
MC down = F8
Task next = F9
Task previous = F10
Toggle focus (sim / app) = focus
Bottom bar left = a
Bottom bar right = s
Previous page = d
Next page = f
Top left button = g
Top right button = h
Custom menu q = q
Custom menu w = w
Custom menu e = e
Custom menu r = r
Custom menu t = t
Custom menu y = y
Custom menu u = u
Custom menu i = i
Custom menu o = o
Custom menu p = p
