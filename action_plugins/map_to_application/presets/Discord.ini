; Discord.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; Discord keybinds are global: assign keys in Discord (Settings > Keybinds), e.g. Ctrl+Shift+F9,
; and add them below. Choose combinations Condor doesn't use.

[app]
program = Discord.exe
window_title =
delivery = keyboard

[functions]
; Push to talk = ctrl+shift+F9
; Mute = ctrl+shift+F10
