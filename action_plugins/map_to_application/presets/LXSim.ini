; LXSim.ini - preset for the GremlinEx action 'Map to Keyboard Ex (App)'
; Choosing a preset only fills in target, delivery and key; the action then stands on its own.
; One function per line:  name = key [window|keyboard|focus]   ([..] overrides the delivery;
; the value 'focus' instead of a key = toggle focus between the sim and the app)
; Fixed LX controls as in the AHK tool XCSoar-LK8000-LXSim-hotkeys (+ top left dial, tested).
; What a button does depends on the LX page: read it on the LX screen.

[app]
program = LXSim.exe
window_title =
delivery = window

[functions]
Top button 1 = 1
Top button 2 = 2
Top button 3 = 3
Top button 4 = 4
Bottom button 1 = q
Bottom button 2 = w
Bottom button 3 = e
Bottom button 4 = r
Top dial (Rotary 2) - page up = PgUp
Top dial (Rotary 2) - page down = PgDn
Bottom right dial (Rotary 4) - up = Up
Bottom right dial (Rotary 4) - down = Down
Bottom left dial (Rotary 3) - zoom out = Left
Bottom left dial (Rotary 3) - zoom in = Right
Top left dial (Rotary 1) - up = Home
Top left dial (Rotary 1) - down = End
OK = l
Cancel = j
Toggle focus (sim / app) = focus
